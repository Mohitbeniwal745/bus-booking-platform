services:
  # ==========================================
  # Database Service (PostgreSQL 16)
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: bus_booking_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-bus_booking}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bus_booking}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================
  # Bus Booking Domain API (FastAPI)
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bus_booking_app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pwd}@db:5432/${POSTGRES_DB:-bus_booking}
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "8000:8000"

  # ==========================================
  # Reverse Proxy (Nginx with HTTPS/TLS)
  # ==========================================
  nginx:
    image: nginx:1.27-alpine
    container_name: bus_booking_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    name: bus_booking_postgres_data

networks:
  app_network:
    name: bus_booking_network
    driver: bridge
