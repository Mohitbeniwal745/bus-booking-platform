name: Bus Booking CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  IMAGE_NAME: bus-booking-service

jobs:
  # ==========================================
  # STAGE 1: Code Quality & Static Analysis
  # ==========================================
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Checks
        run: |
          ruff check .
          ruff format --check .

  # ==========================================
  # STAGE 2: Automated Tests
  # ==========================================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Execute Pytest Suite
        run: |
          pytest -v --tb=short tests/

  # ==========================================
  # STAGE 3: Security & Vulnerability Scan
  # ==========================================
  security-scan:
    name: Dependency & Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Container Security Scanner
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" aquasec/trivy:latest fs --severity CRITICAL,HIGH --ignore-unfixed /workspace

  # ==========================================
  # STAGE 4: Container Build & Tagging
  # ==========================================
  build:
    name: Deterministic Docker Build & Tag
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Version Tags
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag_sha=sha-${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "tag_latest=latest" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag_latest }}
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag_sha }}
          load: true

      - name: Test Container Startup & Health Probe
        run: |
          docker run -d --name test_app -p 8000:8000 \
            -e DATABASE_URL="sqlite:////tmp/test.db" \
            ${{ env.IMAGE_NAME }}:latest
          
          echo "Waiting for container to become healthy..."
          sleep 5
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health || (docker logs test_app && exit 1)
          echo "Container health check passed!"
          docker stop test_app && docker rm test_app
